name: release

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish the release the manifest names, unless it is out already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(node scripts/release-notes.mts --tag)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is out already. Nothing to publish."
            exit 0
          fi
          title="$(node scripts/release-notes.mts --title)"
          node scripts/release-notes.mts > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$title"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
