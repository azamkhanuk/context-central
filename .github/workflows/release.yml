name: release

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish the release the manifest names, unless it is out already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(node scripts/release-notes.mts --tag)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is out already. Nothing to publish."
            exit 0
          fi
          title="$(node scripts/release-notes.mts --title)"
          node scripts/release-notes.mts > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$title"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Attach the command as a package npm installs from the file, where the release lacks it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(node scripts/release-notes.mts --tag)"
          if ! attached="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>&1)"; then
            if [[ "$attached" == *"release not found"* ]]; then
              echo "$tag has no release. Nothing to attach."
              exit 0
            fi
            echo "$attached"
            exit 1
          fi
          folder="$(node --no-warnings scripts/pack.mts "$RUNNER_TEMP/pack")"
          file="$(npm pack "$folder" --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)"
          if [ -z "$file" ] || [ ! -f "$RUNNER_TEMP/$file" ]; then
            echo "npm pack made no file in $RUNNER_TEMP."
            exit 1
          fi
          if grep -Fqx "$file" <<< "$attached"; then
            echo "$file is attached to $tag already. Nothing to attach."
            exit 0
          fi
          gh release upload "$tag" "$RUNNER_TEMP/$file"
